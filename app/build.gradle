apply from: 'tools.gradle'
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace = "com.scurab.android.zumpareader"
    compileSdk = libs.versions.android.sdk.compile.get().toInteger()

    buildFeatures {
        buildConfig = true
        compose = true
    }
    def fileProviderAuthority = "com.scurab.android.zumpareader.fileprovider"
    defaultConfig {
        applicationId = "com.scurab.zumpareader"
        buildConfigField "String", "BUILD_DETAIL", "\"build-" + getDate() + ",git-" + gitSha() + "\""
        buildConfigField "String", "Authority", "\"" + fileProviderAuthority + "\""
        minSdk = libs.versions.android.sdk.min.get().toInteger()
        targetSdk = libs.versions.android.sdk.target.get().toInteger()
        versionCode = 68
        versionName = "3.3.0"
        manifestPlaceholders = [authority: fileProviderAuthority]
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            keyAlias = localProperties.get('releaseKeyAlias')
            keyPassword = localProperties.get('releaseKeyPassword')
            storePassword = localProperties.get('releaseStorePassword')
            var keystorePath = localProperties.get("releaseKeyStore")
            if (keystorePath != null) {
                // without this check, builds fail for debug if 'releaseKeyStore' is missing
                storeFile = file(keystorePath)
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix = "-" + getDate()
            minifyEnabled = false
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = libs.versions.jvmtarget.get()
        targetCompatibility = libs.versions.jvmtarget.get()
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(libs.versions.jvmtarget.get())
    }
}

dependencies {
    //compile fileTree(dir: 'libs', include: ['*.jar'])
    implementation(libs.kotlin.stdlib)
    implementation(libs.bundles.coroutines)
    implementation(platform(libs.firebase.bom))
    implementation(libs.bundles.firebase)
    implementation(platform(libs.koin.bom))
    implementation(libs.bundles.koin)
    implementation(libs.bundles.android.base)
    implementation(libs.bundles.android.lifecycle)
    implementation(platform(libs.androidx.compose.bom))
    implementation(libs.bundles.compose)
    debugImplementation(libs.androidx.compose.ui.tooling)
    implementation(libs.jsoup)
    implementation(libs.gson)
    implementation(libs.bundles.okhttp)

    implementation libs.bundles.retrofit



    implementation libs.kotson



    testImplementation platform(libs.koin.bom)
    testImplementation platform(libs.junit.bom)
    testImplementation libs.bundles.test
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
