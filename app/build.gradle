apply from: 'tools.gradle'
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdk = libs.versions.android.sdk.compile.get().toInteger()

    buildFeatures {
        buildConfig = true
    }
    def fileProviderAuthority = "com.scurab.android.zumpareader.fileprovider"
    defaultConfig {
        namespace "com.scurab.android.zumpareader"
        applicationId "com.scurab.zumpareader"
        buildConfigField "String", "BUILD_DETAIL", "\"build-" + getDate() + ",git-" + gitSha() + "\""
        buildConfigField "String", "Authority", "\"" + fileProviderAuthority + "\""
        minSdk = libs.versions.android.sdk.min.get().toInteger()
        targetSdk = libs.versions.android.sdk.target.get().toInteger()
        versionCode 68
        versionName "3.3.0"
        manifestPlaceholders = [authority: fileProviderAuthority]
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias localProperties.get('releaseKeyAlias')
            keyPassword localProperties.get('releaseKeyPassword')
            storePassword localProperties.get('releaseStorePassword')
            var keystorePath = localProperties.get("releaseKeyStore")
            if (keystorePath != null) {
                // without this check, builds fail for debug if 'releaseKeyStore' is missing
                storeFile file(keystorePath)
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix "-" + getDate()
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = libs.versions.jvmtarget.get()
        targetCompatibility = libs.versions.jvmtarget.get()
    }

    kotlinOptions {
        jvmTarget = libs.versions.jvmtarget.get().toInteger()
        freeCompilerArgs = freeCompilerArgs + ["-Xcontext-receivers"]
    }
}


task(depsize) {
    doLast {
        def size = 0;
        configurations._debugApk.collect { it.length() / (1024 * 1024) }.each { size += it }
        println "Total dependencies size: ${Math.round(size * 100) / 100} Mb"

        configurations
                ._debugApk
                .sort { -it.length() }
                .each { println "${it.name} : ${Math.round(it.length() / (1024) * 100) / 100} kb" }
    }
}

dependencies {
    //compile fileTree(dir: 'libs', include: ['*.jar'])
    implementation(libs.kotlin.stdlib)
    implementation(libs.kotlinx.coroutines)
    implementation(platform(libs.firebase.bom))
    ["crashlytics", "messaging"].forEach {
        implementation("com.google.firebase:firebase-$it-ktx")
    }
    implementation(libs.bundles.android.base)
    implementation(libs.jsoup)
    implementation(libs.bundles.okhttp)

    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.retrofit.adapter.rxjava2

    implementation libs.swipy

    implementation libs.picasso

    implementation libs.kotson
    implementation libs.otto

    implementation "io.reactivex.rxjava2:rxjava:2.2.21"
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'com.jakewharton.rxbinding2:rxbinding:2.0.0'
    def trelo = "2.2.2"
    implementation "com.trello.rxlifecycle2:rxlifecycle:${trelo}"
    implementation "com.trello.rxlifecycle2:rxlifecycle-android:${trelo}"
    implementation "com.trello.rxlifecycle2:rxlifecycle-components:${trelo}"
    implementation "com.trello.rxlifecycle2:rxlifecycle-navi:${trelo}"

    implementation libs.fresco
    implementation "com.facebook.fresco:middleware:3.2.0"
    implementation libs.fresco.animated.gif

    implementation 'com.bogdwellers:pinchtozoom:0.1'

    testImplementation 'junit:junit:4.12'
    def robo = "3.3.1"
    testImplementation "org.robolectric:robolectric:$robo"
    testImplementation "org.robolectric:shadows-support-v4:$robo"
    testImplementation('com.squareup:fest-android:1.0.8') {
        exclude module: 'support-v4'//some weird incompatibility issue
    }
    testImplementation 'org.mockito:mockito-core:2.25.0'
}
