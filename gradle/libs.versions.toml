## Generated by $ ./gradlew refreshVersionsCatalog

[bundles]

android-base = ["androidx-core-ktx", "androidx-annotation", "google-material", "androidx-window"]
android-lifecycle = ["androidx-lifecycle-runtime", "androidx-lifecycle-viewmodel"]
compose = ["androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-ui-tooling-preview", "androidx-compose-foundation", "androidx-compose-material3", "androidx-activity-compose", "androidx-lifecycle-runtime-compose", "androidx-lifecycle-viewmodel-compose", "koin-androidx-compose", "androidx-compose-material-icons-extended", "coil-compose", "coil-network-ktor3", "coil-gif", "androidx-navigation3-runtime", "androidx-navigation3-ui", "androidx-lifecycle-viewmodel-navigation3"]
coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
firebase = ["firebase-analytics", "firebase-crashlytics", "firebase-messaging"]
koin = ["koin-core", "koin-android"]
#okhttp is only the ktor engine now - nothing outside ZumpaHttpClient references it
ktor = ["ktor-client-core", "ktor-client-okhttp", "ktor-client-logging"]
test = ["junit-jupiter", "mockk", "turbine", "kotlinx-coroutines-test", "koin-test", "koin-test-junit5", "ktor-client-mock"]

[plugins]

android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
#agp 9 refuses com.android.library alongside the multiplatform plugin - this is its replacement
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle-plugin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
#compose multiplatform, for the desktop app - not androidx.compose, which is android only
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-plugin-crashlytics" }
jetbrains-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }

[versions]

#the app's own identity, not a dependency - here so the store listing and the catalog agree
app-version-code = "71"
app-version-name = "4.2.0-SNAPSHOT"

android-sdk-compile = "37"
android-sdk-min = "26"
android-sdk-target = "37"

kotlin = "2.4.10"
#https://youtrack.jetbrains.com/issue/CMP-10689/Android-IME-focus-transfer-leaves-WindowInsets.ime-retained-across-screens-in-Compose-Multiplatform-1.12.0
compose-multiplatform = "1.11.1"
jvmtarget = "17"
android-gradle-plugin = "9.3.2"

androidx-activity-compose = "1.13.0"
androidx-annotation = "1.10.0"
#2026.08.xx brings 1.12.0 compose an causes ^ the keyboard issue
androidx-compose-bom = "2026.06.01"
androidx-navigation3 = "1.1.7"
coil = "3.5.0"
kotlinx-serialization = "1.11.0"
androidx-core-ktx = "1.19.0"
androidx-window = "1.5.1"
androidx-lifecycle = "2.11.0"
firebase-bom = "34.18.0"
firebase-plugin-crashlytics = "3.0.8"
google-services = "4.5.0"
google-material = "1.14.0"
koin = "4.2.2"
ksoup = "0.2.6"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
kotlinx-io = "0.9.1"
ktor = "3.5.2"

junit-jupiter = "5.11.4"
mockk = "1.14.11"
turbine = "1.2.1"

[libraries]

androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
#the fold: navigation3 already pulls this in, declared here because TwoPaneScreen reads it
androidx-window = { module = "androidx.window:window", version.ref = "androidx-window" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
#compose artifact versions are managed by the bom
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
#the whole Material set. The artifact is 35MB of sources but costs ~3MB of apk unminified, and
#nothing at all once R8 is on - measured. material-icons-core only carries 49 icons, which is nine
#short of what this app draws, so the app would otherwise ship its own copies of the rest.
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
#animated gifs. Android only - it rides in the `compose` bundle, which only :appAndroid uses, and
#the desktop app draws the first frame as both did before. See buildImageLoader for the decoder.
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
#versions of firebase libraries are managed by the bom
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
google-material = { module = "com.google.android.material:material", version.ref = "google-material" }
#a kotlin multiplatform port of jsoup - see KMP_PLAN.md
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
#koin versions are managed by the bom
